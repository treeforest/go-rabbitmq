version: "2"

run:
  concurrency: 4
  tests: true

linters:
  default: none
  enable:
    - copyloopvar
    - cyclop
    - errcheck
    - errorlint
    - fatcontext
    - gocritic
    - gosec
    - ineffassign
    - misspell
    - modernize
    - nilnesserr
    - revive
    - staticcheck
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
          severity: warning
        - name: var-naming
          severity: warning

  exclusions:
    generated: lax
    paths:
      - tmp

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
